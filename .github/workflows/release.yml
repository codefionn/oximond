# =============================================================================
# oximond release gate for GitHub Actions — the counterpart of the version
# gate in .gitlab-ci.yml. On a v*.*.* tag, the workspace version in Cargo.toml
# must match the tag; then the whole pipeline re-runs (check + test + wasm +
# conformance) as the release gate, and the publish job releases the workspace
# crates to crates.io once the gate passes.
#
# The jobs call the same scripts/ci.sh targets as check.yml and ci.yml. They
# are spelled out here rather than composed from those workflows, so the gate
# a release depends on reads as one file and cannot change shape through a
# refactor of the branch workflows.
#
# --- Runner requirements -----------------------------------------------------
# Same as ci.yml: GitHub-hosted ubuntu-latest runners, the toolchain pinned
# through dtolnay/rust-toolchain, internet access for the conformance corpora,
# 8 GiB of memory comfortable for the test jobs.
#
# --- Secrets ---------------------------------------------------------------
# CARGO_REGISTRY_TOKEN, from the crates-io environment, for the publish job;
# the gate jobs need none.
# =============================================================================

name: release

on:
  push:
    tags: ["v*.*.*"]

# Release pipelines run to completion; a rerun supersedes nothing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep each job within its runner's memory budget; parallelism lives at the
  # workflow level.
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Match tag against workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match workspace version ${version}" >&2
            exit 1
          fi

  check:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - name: Format, clippy, ledger and packaging
        run: scripts/ci.sh fmt clippy ledger package

  test:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Test
        run: scripts/ci.sh test

  wasm:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: Set up node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: WebAssembly smoke test
        run: scripts/ci.sh wasm

  conformance:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Conformance suites
        env:
          OXIMOND_CI_REPORT: conformance-report.txt
        run: scripts/ci.sh conformance
      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conformance-report
          path: conformance-report.txt
          if-no-files-found: ignore

  # Publishes every workspace member without `publish = false` to crates.io,
  # in dependency order. scripts/ci.sh owns the retry and resume logic:
  # crates.io rate-limits new crate names, so a first release of the whole
  # workspace waits the limit out and a rerun after a partial upload resumes
  # where the last attempt stopped. The runner image carries jq, which the
  # target reads cargo metadata with.
  publish:
    needs: [check, test, wasm, conformance]
    runs-on: ubuntu-latest
    # A first release of all workspace crates waits out the new-crate limit.
    timeout-minutes: 360
    environment: crates-io
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@1.97.1
      - name: Publish to crates.io
        run: scripts/ci.sh publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
